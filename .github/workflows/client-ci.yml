name: Client CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint
      - run: yarn build
      - run: yarn test:unit
        env:
          # Vietnam (UTC+7). GitHub runners use UTC, where date bugs that
          # shift a day east of UTC don't show up.
          TZ: Asia/Ho_Chi_Minh

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      # Cache the browser download, keyed on the Playwright version, so it's
      # only fetched again when Playwright is upgraded.
      - id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # System libraries aren't cached, only the browser, so install them on
      # a cache hit too.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: yarn test:e2e
      # Upload the report on every finished run, passing or failing, so a
      # green run can be browsed too. Skipped when the run was cancelled
      # (e.g. by a newer push).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
